<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- L&T Logo Circle -->
  <circle cx="50" cy="50" r="45" fill="#003366" stroke="#003366" stroke-width="2"/>
  
  <!-- Inner white circle -->
  <circle cx="50" cy="50" r="40" fill="white"/>
  
  <!-- L&T stylized symbol -->
  <g transform="translate(50,50)">
    <!-- Simplified L&T representation -->
    <path d="M -20,-15 L -20,15 L -10,15 L -10,5 L 0,5 L 0,-15 Z" fill="#003366"/>
    <path d="M 5,-15 L 5,15 L 15,15 L 15,5 L 20,5 L 20,-5 L 15,-5 L 15,-15 Z" fill="#003366"/>
  </g>
  
  <!-- Outer circle border -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#003366" stroke-width="3"/>
</svg>
