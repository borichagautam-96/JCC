<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/infloai-mark.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="InFloAI System - Streamline vendor invoice processing with OCR and automated tracking" />
  <meta name="keywords" content="InFloAI, invoice, automation, OCR, vendor management" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
  <title>InFlowAI</title>

  <!-- Resolve the theme before first paint so there is no light flash on refresh. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('infloai-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- Liquid Glass refraction (Layer 1b). Very low displacement: content behind
       the glass bends just enough to read as a real material, not a blur. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="lg-refraction" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="1.4" result="soft" />
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
